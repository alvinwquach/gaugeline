name: Supabase local

# The Supabase Auth adapter end to end (A-01): the local Supabase stack from the Supabase CLI (a set of
# containers on this runner: no account, no project, no key of anyone's), real sign-in links read from its
# mail catcher, and the app's row-level security policies on a Postgres service. The stack's keys are its
# own throwaway local ones, printed by `supabase status`. No secret is read.
#
# Its own workflow, not a job in ci.yml: the release workflow's gate waits for the whole ci.yml run on a
# commit to succeed, and this job must never block a release. Main and the Release pull request only (CI
# diet), like docs-examples: an ordinary pull request does not run it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supabase-local:
    # A draft pull request runs nothing; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.head_ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The app's own tables, as in hosted-db (by major-version tag; see the note there).
        image: postgres:16
        env:
          # A throwaway server inside the job, reachable only from it: not a secret.
          POSTGRES_PASSWORD: gaugeline-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAUGELINE_TEST_DATABASE_URL: postgres://postgres:gaugeline-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Supabase CLI at an exact version, in a folder of the runner's own (not the checkout): Auth, its
      # API gateway, the mail catcher and Supabase's Postgres; the services the test does not use are left out.
      - name: Start the local Supabase stack
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes supabase@3.1.0 init --force
          npx --yes supabase@3.1.0 start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,postgrest
      - name: Hand the stack's local addresses and keys to the test
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes supabase@3.1.0 status -o env > sb.env
          set -a; . ./sb.env; set +a
          {
            echo "GAUGELINE_SUPABASE_LOCAL_URL=$API_URL"
            echo "GAUGELINE_SUPABASE_LOCAL_ANON_KEY=$ANON_KEY"
            echo "GAUGELINE_SUPABASE_LOCAL_JWT_SECRET=$JWT_SECRET"
            echo "GAUGELINE_SUPABASE_LOCAL_MAIL_URL=${MAILPIT_URL:-$INBUCKET_URL}"
            echo "GAUGELINE_SUPABASE_LOCAL_JWKS=$(curl -fsS "$API_URL/auth/v1/.well-known/jwks.json" -H "apikey: $ANON_KEY" || true)"
          } >> "$GITHUB_ENV"
      - run: pnpm exec vitest run apps/hosted/app/__tests__/supabase-local.test.ts
      - name: Stop the local Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}
        run: npx --yes supabase@3.1.0 stop --no-backup
