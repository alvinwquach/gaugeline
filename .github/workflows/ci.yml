name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# No secrets are used anywhere in this workflow, so a pull request from a fork cannot reach one.
permissions:
  contents: read

# A new push to a pull request cancels the run of the older commit. Runs on main are never cancelled:
# the release workflow waits for the full matrix of the commit it releases.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Pull requests: Linux on Node 22 and 24, Windows on Node 24. Pushes to main (after each merge):
      # the full matrix, three systems on both Node versions. The release workflow waits for it.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"}]}' || '{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":["22","24"]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated files are not committed on branches: regenerate them in this checkout first.
      - run: pnpm gen:all --no-surface
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  lint:
    # Lint and the generated-file checks run once, on the active LTS.
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"
      # Generated files are not committed on branches. Regenerate them here (README tables, options, check ids,
      # skill, adapter index, public surface): the job fails if generation fails or its rules are broken (an
      # unfinished check text, a check id removed, a breaking surface change without its changeset), not
      # because the committed copy differs. The surface is compared with the base's lock file.
      - run: pnpm gen:all --base FETCH_HEAD
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schema:check
      - run: pnpm docs:changelog --check
      - run: pnpm adr:check
      - run: pnpm community:check
      # A released check's "Since" version never changes (docs/check-since.lock.json).
      - run: pnpm since --base FETCH_HEAD

  hosted-db:
    # The hosted app's database tests (apps/hosted/db): row-level security, append-only decisions and the
    # migrations, against a real Postgres in a service container. The test matrix skips them (no server on
    # Windows or macOS); here GAUGELINE_REQUIRE_TEST_DATABASE makes a missing server a failure. Not a
    # required check while the hosted app is unreleased.
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway server inside the job, reachable only from it: not a secret.
          POSTGRES_PASSWORD: gaugeline-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAUGELINE_TEST_DATABASE_URL: postgres://postgres:gaugeline-test@127.0.0.1:5432/postgres
      GAUGELINE_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/hosted

  docs-examples:
    # Runs every "$ npx gaugeline" example in the docs against its fixture and compares the output.
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated files are not committed on branches: regenerate them in this checkout first.
      - run: pnpm gen:all --no-surface
      - run: pnpm build
      - run: pnpm docs:examples

  pack:
    # The tarball people will npx: contents, size budget, and a run under the oldest supported Node (22).
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: pack and smoke (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated files are not committed on branches: regenerate them in this checkout first.
      - run: pnpm gen:all --no-surface
      - run: pnpm build
      - run: pnpm smoke
