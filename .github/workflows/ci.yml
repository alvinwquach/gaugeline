name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# No secrets are used anywhere in this workflow, so a pull request from a fork cannot reach one.
permissions:
  contents: read

# CI diet (owner policy, 11 Nov 2026). A pull request runs Node 22 on Linux plus lint. The full matrix
# (Linux, Windows and macOS on Node 22 and 24), docs-examples and pack-and-smoke run on every push to
# main and on the Release pull request (head ref changeset-release/main).
#
# A new push to a pull request cancels the run of the older commit, and a new merge to main cancels
# the older run on main. The release workflow's ci-gate therefore never releases a cancelled run: the
# newer commit's own gate waits for its own full matrix.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.head_ref) || 'ci-main' }}
  cancel-in-progress: true

jobs:
  test:
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Pull requests: Linux on Node 22 only. Pushes to main (after each merge) and the Release pull request:
      # the full matrix, three systems on both Node versions. The release workflow waits for the push run.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && '{"include":[{"os":"ubuntu-latest","node":"22"}]}' || '{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":["22","24"]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  lint:
    # Lint and the generated-file checks run once, on the active LTS.
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm schema:check
      - run: pnpm docs:flags:check
      - run: pnpm docs:changelog --check
      - run: pnpm gen:checks --check
      - run: pnpm gen:adapters --check
      - run: pnpm gen:skill --check
      - run: pnpm adr:check
      - run: pnpm community:check
      - name: Public surface (STABILITY.md)
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"
          pnpm surface --check --base FETCH_HEAD
          # A released check's "Since" version never changes (docs/check-since.lock.json).
          pnpm since --base FETCH_HEAD

  docs-examples:
    # Runs every "$ npx gaugeline" example in the docs against its fixture and compares the output.
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    # Main and the Release pull request only (CI diet): an ordinary pull request does not run this job.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.head_ref == 'changeset-release/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:examples

  pack:
    # The tarball people will npx: contents, size budget, and a run under the oldest supported Node (22).
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    # Main and the Release pull request only (CI diet): an ordinary pull request does not run this job.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' || github.head_ref == 'changeset-release/main')
    name: pack and smoke (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
