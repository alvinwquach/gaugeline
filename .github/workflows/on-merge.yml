name: On merge

# Files the merged pull request's status entry, changelog line and ledger row, then calls the
# site's deploy hook. Switched off until the owner sets REPORT_POST_URL and REPORT_POST_SECRET
# (and, optionally, DEPLOY_HOOK_URL). Automation commits nothing to main: the pull request is the record.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# One report per pull request; a newer run of the same pull request replaces the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/reporting/on-merge.ts
        env:
          REPORT_POST_URL: ${{ secrets.REPORT_POST_URL }}
          REPORT_POST_SECRET: ${{ secrets.REPORT_POST_SECRET }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
