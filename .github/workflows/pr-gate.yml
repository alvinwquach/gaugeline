name: PR gate

# Separate from ci.yml so adding or removing a label re-runs only this job, not the test matrix.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue waits for every required check to report; this one is skipped (which counts as passed) there,
  # because the pull request was gated before it was queued.
  merge_group:

permissions:
  contents: read

jobs:
  pr-gate:
    # The Release pull request deletes changesets by design.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pr-gate --base "origin/${{ github.base_ref }}"
