name: PR body

# A pull request whose Changelog section is missing or still holds a placeholder cannot merge
# (make "pr-body" a required check in the branch protection rules).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to the branch cancels the older run of this check.
concurrency:
  group: pr-body-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    # A draft pull request runs no CI; marking it ready starts it (ready_for_review). Other events are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pr:check
