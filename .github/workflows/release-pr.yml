name: Release PR

# On every push to main, Changesets opens or updates one pull request titled "Release" that deletes
# the .changeset files, bumps versions and rewrites CHANGELOG.md. Merging that pull request publishes
# with provenance and pushes the tag.
#
# Switched off until the owner opts in with repository variables:
#   RELEASE_PR_ENABLED=true   open and update the Release pull request
#   PUBLISH_ENABLED=true      also publish when it is merged (needs the NPM_TOKEN secret)
# Pushes to main come only from merged pull requests, never from a fork, so forks never see the token.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  ci-gate:
    # Pull requests run Node 22 on Linux only (and the Release pull request runs the full matrix on its head).
    # The full matrix runs again on main after each merge. Nothing is released from a commit until that
    # run is green. A run on main is not cancelled by a newer merge (ci.yml concurrency), but GitHub drops an
    # older queued run when a newer one queues: a cancelled run is never treated as green. This commit is then not released from here; the newer commit includes it,
    # and the newer commit's own gate waits for its own full matrix.
    if: vars.RELEASE_PR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the full CI matrix on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 110); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | [.status, (.conclusion // "")] | @tsv')
            status=$(printf '%s' "$run" | cut -f1)
            conclusion=$(printf '%s' "$run" | cut -f2)
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then echo "The full matrix is green for $SHA."; exit 0; fi
              if [ "$conclusion" = "cancelled" ]; then
                echo "The full matrix for $SHA was cancelled by a newer merge. Not releasing $SHA; the newer commit's run releases it."; exit 1
              fi
              echo "The full matrix finished with: $conclusion. Not releasing $SHA."; exit 1
            fi
            echo "CI on $SHA: ${status:-not started}. Waiting."; sleep 30
          done
          echo "CI on $SHA did not finish in time. Not releasing."; exit 1

  release:
    needs: ci-gate
    if: vars.RELEASE_PR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          title: Release
          commit: "chore: release"
          version: pnpm run version
          publish: ${{ vars.PUBLISH_ENABLED == 'true' && 'pnpm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  smoke:
    # After a publish, install the published version by name in a clean container (K01).
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version=$(node -p "JSON.parse(process.argv[1]).find(p => p.name === 'gaugeline').version" '${{ needs.release.outputs.packages }}')
          bash scripts/smoke-published.sh "$version"
        env:
          SMOKE_WRONG_URL: ${{ vars.SMOKE_WRONG_URL }}
          SMOKE_CLEAN_URL: ${{ vars.SMOKE_CLEAN_URL }}
