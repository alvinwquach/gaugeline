name: Release

# Switched off until the owner publishes: it only runs when started by hand, and it is a dry run
# unless the "publish" input is set. Pull requests (including from forks) can never trigger it, so
# they can never reach the npm token.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to npm (otherwise a dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance: the tarball is signed as built from this repository

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm smoke
      - name: Publish gaugeline with provenance
        working-directory: packages/cli
        run: npm publish --provenance --access public ${{ inputs.publish && '' || '--dry-run' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
